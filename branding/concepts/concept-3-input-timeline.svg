<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" style="color:#0F172A">
  <!-- Input-timeline mark: TAStudio-style piano roll with playhead -->
  <g fill="currentColor">
    <!-- past frames: pressed inputs (solid) -->
    <rect x="41" y="20" width="16" height="16" rx="4"/>
    <rect x="20" y="41" width="16" height="16" rx="4"/>
    <rect x="62" y="41" width="16" height="16" rx="4"/>
    <rect x="41" y="62" width="16" height="16" rx="4"/>
    <rect x="83" y="62" width="16" height="16" rx="4"/>
    <rect x="62" y="83" width="16" height="16" rx="4"/>
    <!-- past frames: unpressed (faint) -->
    <g opacity="0.16">
      <rect x="20" y="20" width="16" height="16" rx="4"/>
      <rect x="62" y="20" width="16" height="16" rx="4"/>
      <rect x="83" y="20" width="16" height="16" rx="4"/>
      <rect x="41" y="41" width="16" height="16" rx="4"/>
      <rect x="83" y="41" width="16" height="16" rx="4"/>
      <rect x="20" y="62" width="16" height="16" rx="4"/>
      <rect x="62" y="62" width="16" height="16" rx="4"/>
      <rect x="20" y="83" width="16" height="16" rx="4"/>
      <rect x="41" y="83" width="16" height="16" rx="4"/>
      <rect x="83" y="83" width="16" height="16" rx="4"/>
    </g>
    <!-- future frames beyond playhead (fainter) -->
    <g opacity="0.28">
      <rect x="118" y="20" width="16" height="16" rx="4"/>
      <rect x="139" y="41" width="16" height="16" rx="4"/>
      <rect x="118" y="62" width="16" height="16" rx="4"/>
      <rect x="139" y="83" width="16" height="16" rx="4"/>
    </g>
    <g opacity="0.1">
      <rect x="139" y="20" width="16" height="16" rx="4"/>
      <rect x="118" y="41" width="16" height="16" rx="4"/>
      <rect x="139" y="62" width="16" height="16" rx="4"/>
      <rect x="118" y="83" width="16" height="16" rx="4"/>
    </g>
  </g>
  <!-- playhead -->
  <rect x="105" y="14" width="6" height="91" rx="3" fill="#22C55E"/>
  <text x="186" y="75" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="42" font-weight="500" fill="currentColor">toolAssisted<tspan font-weight="700" fill="#22C55E">.run</tspan></text>
</svg>
